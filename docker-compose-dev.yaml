# !NOTE: This is NOT a prodiuction ready docker-compose file. It is meant for development purposes only.
networks:
  dev:
    external: true
    name: ${DOCKER_NETWORK}

volumes:
  postgres_data:
  geoserver_postgres_data:
  kc-db_data:
  geoserver_data:
  # Shared ldproxy store: UMP writes GeoPackages + entity YAML here, ldproxy
  # reads and publishes them. Both services mount this same volume.
  ldproxy_store:

services:
  # !NOTE: this is for testing the current app version in a container, only!
  # development is executed locally
  # and the prod deployment differs anyway!
  ump:
    # Pull the released registry image by default. To test the CURRENT working
    # tree instead (e.g. unreleased V-10 result-storage code), run
    # `docker compose -f docker-compose-dev.yaml build ump` first: Compose then
    # builds locally and tags the result under this same image name, so nothing
    # else in the file has to change.
    image: ${CONTAINER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "unless-stopped"
    ports:
      - ${WEBAPP_PORT_EXTERNAL}:8000
    environment:
      PYTHONUNBUFFERED: 1
      UMP_LOG_LEVEL: DEBUG
      UMP_PROVIDERS_FILE: /app/providers.yaml
      UMP_API_SERVER_URL: "http://localhost:8004/"
      UMP_API_SERVER_URL_PREFIX: "/"
      UMP_API_SERVER_HOST: "0.0.0.0"
      # Must match the container side of the port mapping above
      # (${WEBAPP_PORT_EXTERNAL}:8000). Uvicorn listens on this port *inside*
      # the container; the external port (8004) is set via WEBAPP_PORT_EXTERNAL.
      UMP_API_SERVER_PORT: 8000
      UMP_API_SERVER_WORKERS: 1
      UMP_REMOTE_JOB_STATUS_REQUEST_INTERVAL: 5
      UMP_REMOTE_JOB_TTW: 900
      UMP_JOB_STORE: "postgres"
      UMP_JOB_DELETE_INTERVAL: 240
      #
      UMP_DATABASE_URL: postgresql+asyncpg://ump:ump@ump-db:5432/ump
      UMP_DATABASE_NAME: ump
      UMP_DATABASE_HOST: ump-db
      UMP_DATABASE_PORT: 5432
      UMP_DATABASE_USER: ump
      UMP_DATABASE_PASSWORD: ump
      #
      UMP_REWRITE_REMOTE_LINKS: true
      UMP_VERIFY_REMOTE_RESULTS: true
      UMP_PER_PROCESS_FETCH: false
      #
      UMP_AUTH_ENABLED: false
      UMP_JWKS_URL: http://keycloak:8080/auth/realms/UrbanModelPlatform/protocol/openid-connect/certs
      UMP_JWT_ISSUER: http://keycloak:8080/auth/realms/UrbanModelPlatform
      UMP_JWT_AUDIENCE: account
      UMP_JWT_ROLES_CLAIMS: realm_access.roles,resource_access.ump-client.roles
      UMP_JWKS_CACHE_TTL_SECONDS: 3600
      UMP_PUBLIC_PROCESSES: true
      #
      # ── Feature V: result storage (ldproxy) ──────────────────────────────
      # Store root shared with the ldproxy service (see ldproxy_store volume).
      UMP_RESULTSTORE_LDPROXY_ROOTPATH: /data/ldproxy-store
      # The two directories UMP writes into, both under the shared store root.
      # These are the defaults; shown explicitly here for discoverability.
      UMP_RESULTSTORE_GPKG_PATH: /data/ldproxy-store/resources/features
      UMP_RESULTSTORE_ENTITIES_PATH: /data/ldproxy-store/entities/instances
      # Public base URL clients use to fetch stored collections. ldproxy 4.x
      # serves each API at the root path `/{service-id}` (the `/rest/services`
      # prefix of 3.x was removed). Adjust host/port to your deployment.
      UMP_RESULTSTORE_LDPROXY_BASE_URL: "http://localhost:7080/ump-results"
      # Internal (container-network) URL UMP uses only to probe whether a newly
      # stored collection is actually published, so it can re-touch the service
      # entity until ldproxy picks up the just-loaded provider. Must NOT use
      # localhost here — that would resolve to the UMP container itself.
      UMP_RESULTSTORE_LDPROXY_INTERNAL_URL: "http://ldproxy:7080/ump-results"
      UMP_RESULTSTORE_LDPROXY_SERVICE_ID: ump-results
      UMP_RESULTSTORE_LDPROXY_NATIVE_CRS: 4326
      UMP_RESULTSTORE_CONFIG_BACKEND: filesystem
    volumes:
      - ./providers.yaml:/app/providers.yaml
      - ldproxy_store:/data/ldproxy-store
    depends_on:
      - ump-db
      - mock-ogc-server
      - modelserver
      - ldproxy
    networks:
      - dev

  # ldproxy publishes the stored GeoPackages as OGC API Features collections.
  # With `store.watch: true` (see ./ldproxy-cfg.yml) ldproxy 4.x *hot-reloads*
  # the per-job provider/service entities UMP writes — no restart per job.
  # NOTE: pin to a known-good tag; :latest may change entity-schema
  # expectations. ldproxy 4.x is backward-compatible with the
  # entityStorageVersion:2 layout UMP writes
  # (entities/instances/{providers,services}, resources/features).
  #
  # STORE LAYOUT (changed vs 3.x): in 4.x the `--data-dir` *is* the store root
  # (`FS . [ALL]`), so the shared volume is mounted at /ldproxy/data — NOT at
  # /ldproxy/data/store as in 3.x. UMP writes entities/ and resources/ at the
  # volume root, which ldproxy then reads directly as its data dir.
  #
  # FRESH-VOLUME BOOTSTRAP (entrypoint override): on a brand-new volume the
  # dirs are root-owned and empty. UMP runs as uid 1000 and must write the
  # entity/resource files, and ldproxy's file watcher only registers the
  # store subdirectories that already exist when it starts. So before launching
  # ldproxy we (1) pre-create the skeleton UMP writes into and (2) chown it to
  # uid 1000 so UMP can write and the watcher hot-reloads the very first job
  # without any manual chown or restart. ldproxy runs as root, so it still
  # reads everything. This mirrors ldproxy's own entrypoint (see `docker
  # inspect`), only prefixed with the mkdir/chown.
  ldproxy:
    image: iide/ldproxy:4.6.1
    restart: "unless-stopped"
    entrypoint:
      - /bin/bash
      - -c
      - >
        mkdir -p /ldproxy/data/entities/instances/providers
        /ldproxy/data/entities/instances/services
        /ldproxy/data/resources/features &&
        chown -R 1000:2000 /ldproxy/data/entities /ldproxy/data/resources &&
        exec /ldproxy/bin/ldproxy --data-dir=/ldproxy/data --start-time=$$(date +%s%3N)
    ports:
      - "7080:7080"
    volumes:
      - ldproxy_store:/ldproxy/data
      # Global config enabling store `watch: true` so ldproxy hot-reloads the
      # per-job provider/service entities UMP writes, without a restart.
      - ./ldproxy-cfg.yml:/ldproxy/data/cfg.yml:ro
    networks:
      - dev

  # Lightweight mock OGC API Processes server — no external dependencies.
  # Provides echo, hello-world, slow, and failing-job processes for manual testing.
  # Add to providers.yaml: name: mock, url: http://mock-ogc-server:5001
  mock-ogc-server:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./scripts/mock_ogc_server.py:/app/mock_ogc_server.py:ro
    environment:
      MOCK_BASE_URL: http://mock-ogc-server:5001
      MOCK_JOB_DELAY_SECONDS: "2"
      MOCK_SLOW_DELAY_SECONDS: "10"
    command: >
      sh -c "pip install fastapi uvicorn geopandas pyogrio shapely --quiet &&
             uvicorn mock_ogc_server:app --host 0.0.0.0 --port 5001"
    ports:
      - "5002:5001"
    networks:
      - dev

  # Real pygeoapi model server (modelserver_example) — exposes the rewritten,
  # UMP-compatible geo processes:
  #   - hello-world / squareroot   (plain value passthrough)
  #   - random-geo                 (application/geo+json FeatureCollection)
  #   - random-fgb / random-fgb-href (raw application/flatgeobuf bytes)
  # Installed at container start from the mounted source (same pattern as the
  # mock server) so local edits to the process code take effect on restart.
  # fiona/shapely ship manylinux wheels with bundled GDAL; libexpat1 is the
  # only extra system lib fiona needs at runtime.
  modelserver:
    image: python:3.11-slim-bookworm
    working_dir: /app
    volumes:
      - ./modelserver_example:/app
    environment:
      PYGEOAPI_CONFIG: /app/pygeoapi-config.yaml
      PYGEOAPI_OPENAPI: /app/example-openapi.yaml
      PYGEOAPI_SERVER_HOST: modelserver
      PYGEOAPI_SERVER_PORT_INTERNAL: "5000"
      PYGEOAPI_SERVER_PORT_EXTERNAL: "5000"
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends libexpat1 &&
             pip install --quiet 'pygeoapi==0.16.1' flask-cors 'fiona>=1.9,<2.0' shapely &&
             pip install --quiet --no-deps -e /app &&
             pygeoapi openapi generate /app/pygeoapi-config.yaml --output-file /app/example-openapi.yaml &&
             pygeoapi serve --flask"
    ports:
      - "5000:5000"
    networks:
      - dev

# !NOTE: here starts the dev environment setup!
# these apps a required dependencies for the UMP
# and are not part of the UMP itself
  ump-db:
    image: postgres:18.4
    volumes:
      - postgres_data:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ump
      POSTGRES_USER: ump
      POSTGRES_PASSWORD: ump
    ports:
      - ${UMPDB_PORT_EXTERNAL}:5432
    networks:
      - dev

  # Separate PostGIS database for Geoserver results
  geoserver-db:
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - geoserver_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: geoserver_results
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: geoserver
    ports:
      - ${GEOSERVER_DB_PORT_EXTERNAL:-5434}:5432
    networks:
      - dev

 # !NOTE: now using dedicated database for geoserver results!
  geoserver:
    image: kartoza/geoserver:2.22.0
    ports:
      - ${GEOSERVER_PORT_EXTERNAL}:8080
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      #---
      # using dedicated database for geoserver results
      HOST: geoserver-db
      POSTGRES_DB: geoserver_results
      POSTGRES_USER: geoserver
      POSTGRES_PASS: geoserver
      #---
    depends_on:
      - geoserver-db
    networks:
      - dev

  noise-v4-api:
    image: lgvanalytics.azurecr.io/noiseprocesses:v4.0.5custom-coefficients-1.2.5
    restart: "unless-stopped"
    environment:
      FP_CELERY_BROKER_DB: '0'
      FP_CELERY_BROKER_HOST: "noise-v4-redis"
      FP_CELERY_BROKER_PORT: '6379'
      NP_JAVA_LIB_DIR: "/app/dist/lib"
      NP_LOG_LEVEL: DEBUG

      FP_RESULTS_CACHE_TTL_DAYS: '365'
      FP_RESULT_CACHE_DB: '1'
      FP_RESULT_CACHE_HOST: "noise-v4-redis"
      FP_RESULT_CACHE_PORT: '6379'

      FP_API_TITLE: "Noise calculation - OGC API Processes"
      FP_API_DESCRIPTION: "An OGC API Processes implementation for noise calculations."

      FP_CELERY_TASK_TLIMIT_HARD: 1800
      FP_CELERY_TASK_TLIMIT_SOFT: 1500
      FP_RESULTS_TEMP_TTL_HOURS: 24

      FP_JOB_STATUS_TTL_DAYS: 365
      FP_SYNC_EXECUTION_TIMEOUT_SECONDS: 10
      FP_LOG_LEVEL: "DEBUG"

      NP_JAVA_MAX_HEAP_SIZE: 2048
      NP_JAVA_INITIAL_HEAP_SIZE: 1024
      NP_DATABASE_IN_MEMORY: True
    command: ['uvicorn', 'app:app', '--host', '0.0.0.0', '--port', '8000', "--log-level", "debug"]
    ports:
      - 8001:8000
    networks:
      - dev

  noise-v4-worker:
    image: lgvanalytics.azurecr.io/noiseprocesses:v4.0.5custom-coefficients-1.2.5
    restart: "unless-stopped"
    environment:
      FP_RESULT_CACHE_DB: '1'
      FP_RESULT_CACHE_HOST: "noise-v4-redis"
      FP_RESULT_CACHE_PORT: '6379'
      FP_RESULTS_CACHE_TTL_DAYS: 365
      
      NP_JAVA_LIB_DIR: "/app/dist/lib"
      
      NP_JAVA_MAX_HEAP_SIZE: 2048
      NP_JAVA_INITIAL_HEAP_SIZE: 1024
      NP_DATABASE_IN_MEMORY: True

      FP_CELERY_BROKER_HOST: "noise-v4-redis"
      FP_CELERY_BROKER_PORT: 6379
      FP_CELERY_BROKER_DB: 0
      FP_CELERY_TASK_TLIMIT_HARD: 1800 # 22 Minutes
      FP_CELERY_TASK_TLIMIT_SOFT: 1200 # 20 Minutes

      FP_JOB_STATUS_TTL_DAYS: 365

    # ports:
    #   - ${WEBAPP_PORT_CONTAINER}:${WEBAPP_PORT}
    command: ['celery', '-A', 'fastprocesses.worker.celery_app', 'worker', '--loglevel=debug']
    networks:
      - dev

  noise-v4-redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    # expose: 
    #   - ${REDIS_PORT}
    restart: "unless-stopped"
    command: dragonfly --requirepass "" # --appendonly yes
    networks:
      - dev

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    ports: 
      - ${KEYCLOAK_PORT_EXTERNAL}:8080
    volumes:
      - ./keycloak-example-conf.json:/opt/keycloak/data/import/realm-export.json
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FRONTEND_URL: http://keycloak:8080/auth/realms/UrbanModelPlatform
      KC_DB: postgres
      KC_DB_URL_HOST: kc-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PATH: /auth
      KC_HTTP_RELATIVE_PATH: /auth
    command: ['start', '--proxy-headers', 'xforwarded', '--http-enabled', 'true', '--import-realm']
    depends_on:
      - kc-db
    networks:
      - dev

  kc-db:
    image: postgis/postgis:14-3.3
    volumes:
      - kc-db_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    expose:
      - 5432
    networks:
      - dev