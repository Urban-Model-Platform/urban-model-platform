{{/*
RBAC for the `k8s` result-storage config backend (Feature V / V-13).

With configBackend=k8s, UMP writes the ldproxy entity YAMLs as ConfigMaps
instead of files. That needs API access — but only to the two named objects,
so the rules are scoped with `resourceNames` rather than granting blanket
access to every ConfigMap in the namespace (which would include this chart's
own settings and providers ConfigMaps, and any secretsish config a neighbour
workload keeps there).

`create` cannot be restricted by resourceNames — the API server evaluates
authorization before the object name is known — so it is granted separately at
the collection level. That is the one unavoidable widening; get/update/patch/
delete stay pinned to the two objects.
*/}}
{{- if and .Values.resultStore.enabled (eq (.Values.resultStore.configBackend | default "filesystem") "k8s") }}
{{- $k8s := .Values.resultStore.k8s | default dict }}
{{- if (dig "rbac" "create" true $k8s) }}
{{- $serviceCm := $k8s.serviceConfigMap | default "ump-ldproxy-service" }}
{{- $providerCm := $k8s.providerConfigMap | default "ump-ldproxy-providers" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ump.fullname" . }}-resultstore
  namespace: {{ $k8s.namespace | default .Release.Namespace }}
  labels:
    {{- include "ump.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ $serviceCm | quote }}
      - {{ $providerCm | quote }}
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ump.fullname" . }}-resultstore
  namespace: {{ $k8s.namespace | default .Release.Namespace }}
  labels:
    {{- include "ump.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ump.fullname" . }}-resultstore
subjects:
  - kind: ServiceAccount
    name: {{ include "ump.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
