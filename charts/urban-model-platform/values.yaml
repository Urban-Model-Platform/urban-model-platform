# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: lgvanalytics.azurecr.io/urban-model-platform
  pullPolicy: IfNotPresent
  tag: "3.0.0alpha"
  pullSecrets:
    - name: secret

replicaCount: 1

labels: {}

allowedOrigins: []
  # - name: "my-frontend"
  #   hosts:
  #     - https://MY-FRONTEND-DOMAIN
  #   allowedMethods:
  #     - GET
  #     - POST
  #     - PUT
  #     - DELETE
  #     - OPTIONS
  #   allowedHeaders:
  #     - Content-Type
  #     - Authorization
  #   allowCredentials: true

tls:
  enabled: false
  issuer:
    prodEnabled: false
    email:  ""
  gateway:
    name: ""
    httpSectionName: ""
    tlsSectionName: ""
    hostName: ""
  clusterIssuerRef:
    name: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 8000 # port under which the svc answers
  targetPort: 8000 # port the container itself uses

config:
  logLevel: "DEBUG"
  providersFilePath: "./providers.yaml"
  providersFileMountPath: /app
  apiServerUrl: "http://localhost:8000"
  apiServerUrlPrefix: "/"
  apiServerWorkers: "4"
  apiServerPort: "8000"
  remoteJobStatusRequestInterval: "5"
  remoteJobTtw: ""
  jobDeleteInterval: "240"
  jobStore: "memory"
  rewriteRemoteLinks: "true"
  verifyRemoteResults: "true"
  perProcessFetch: "false"
  supportedApiVersions: "1.0"
  readinessPath: "/"
  siteTitle: "Urban Model Platform"
  siteDescription: "An OGC API Processes gateway for urban models."
  siteContact: "maintainers@example.org"

auth:
  enabled: "false"
  publicProcesses: "false"
  jwtRolesClaims: "realm_access.roles"
  jwksCacheTtlSeconds: "3600"
  jwksUrl: ""
  jwtIssuer: ""
  jwtAudience: ""
  existingSecret:
    name: ""

postgresConnection:
  enabled: false
  databaseUrl: ""
  # existing secret must use canonical cnpg secret keys:
  # dbname
  # user
  # password
  # host
  # port
  existingSecret:
    name: postgres-credentials

# If configMap for providers is already existing and should not be overwritten, set this to true. Default: false
providers:
  existingConfigMap:
    name: "" # Set to use existing ConfigMap instead of creating a new one
  content: |
    modelserver:
      name: "modelserver"
      url: "http://localhost:5005" 
      authentication:
        type: "BasicAuth"
        user: "user"
        password: "password"
      timeout:  1800
      processes:
        hello-world:
          result-storage: "remote"
          anonymous-access: True
        squareroot:
          result-storage: "remote"
          anonymous-access: True
        hello-geo-world:
          result-storage: "remote"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

tolerations:
  - key: ump/reservedFor
    operator: "Equal" 
    value: app
    effect: NoSchedule
  - key: ump/reservedFor
    operator: "Equal" 
    value: app
    effect: NoExecute

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true

affinity: {}
