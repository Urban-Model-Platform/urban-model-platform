---
# -----------------------------------------------------------------------------
# DOCUMENTED FEATURE PROVIDER EXAMPLE
# -----------------------------------------------------------------------------
# Suggested target path in an ldproxy store layout:
#   store/entities/providers/flood_levels.yml
#
# This file defines how ldproxy reads the source data.
# In this example the source is a GeoPackage and the provider exposes one
# feature type called flood_levels.
# -----------------------------------------------------------------------------

# Unique provider id.
# In the simple case this matches the service id, so FEATURES_CORE can bind to
# it implicitly or explicitly.
id: flood_levels

# Enables or disables the provider.
enabled: true

# Internal storage version used by ldproxy.
# Keep this as generated by ldproxy or the examples in your target version.
entityStorageVersion: 2

# Timestamps used by ldproxy entity storage.
# These are usually generated automatically, but are shown here so the file is
# self-contained as documentation.
createdAt: 1741938903445
lastModified: 1741938903445

# Entity category: FEATURE means this provider serves feature data.
providerType: FEATURE

# Provider implementation.
# Depending on ldproxy version, SQL providers may use providerSubType: SQL or
# featureProviderType: SQL. Use the form your version expects.
providerSubType: SQL

# Native coordinate reference system of the source data.
# Example here is ETRS89 / UTM zone 32N.
nativeCrs:
  code: 25832
  forceAxisOrder: LON_LAT

# Skip strict schema/type validation while setting up the provider.
# Useful during early iteration with GeoPackage or changing source schemas.
typeValidation: NONE

# -----------------------------------------------------------------------------
# connectionInfo
# Defines how ldproxy connects to the source database.
# For GeoPackage, dialect is GPKG and database is the .gpkg file name/path.
# -----------------------------------------------------------------------------
connectionInfo:
  # SQL dialect / driver family.
  dialect: GPKG

  # Database file name.
  # Example: if the file lives in the configured provider data directory.
  database: flood_levels.gpkg

  # Connection pool settings.
  # For file-based GeoPackage, modest values are usually enough.
  pool:
    # -1 means no explicit hard upper limit from config.
    maxConnections: -1

    # Keep at least one connection ready.
    minConnections: 1

    # Fail startup immediately if the database cannot be opened.
    initFailFast: true

    # Wait time for initial pool connection attempt.
    initFailTimeout: 1

    # How long idle pooled connections may stay open.
    idleTimeout: 10m

    # false means the pool is private to this provider.
    shared: false

# -----------------------------------------------------------------------------
# sourcePathDefaults
# Defaults reused for multiple feature types.
# primaryKey is the source column that uniquely identifies rows.
# sortKey is the default stable ordering key.
# -----------------------------------------------------------------------------
sourcePathDefaults:
  primaryKey: OBJECTID
  sortKey: OBJECTID

# -----------------------------------------------------------------------------
# queryGeneration
# Controls internal SQL query generation behavior.
# -----------------------------------------------------------------------------
queryGeneration:
  # Number of rows processed in one chunk when scanning or streaming data.
  chunkSize: 10000

  # Whether ldproxy should compute numberMatched for feature responses.
  computeNumberMatched: true

# -----------------------------------------------------------------------------
# types
# Declares the feature types exposed by this provider.
# The key flood_levels is the name the service must reference as featureType.
# -----------------------------------------------------------------------------
types:
  flood_levels:
    # Source object/table/layer path.
    # For GeoPackage, this is typically the layer/table name prefixed by '/'.
    sourcePath: /flood_levels

    # Properties define the public schema of the feature type.
    properties:
      # -----------------------------------------------------------------------
      # id
      # Logical feature id exposed by the API.
      # role: ID marks it as the identifier property.
      # excludedScopes can suppress the field in certain read/write scopes.
      # -----------------------------------------------------------------------
      id:
        sourcePath: OBJECTID
        type: INTEGER
        role: ID
        excludedScopes:
          - RECEIVABLE

      # -----------------------------------------------------------------------
      # geometry
      # Primary geometry of the feature.
      # role: PRIMARY_GEOMETRY marks the spatial geometry used in feature and
      # map responses.
      # geometryType should match the real source geometry type.
      # -----------------------------------------------------------------------
      geometry:
        sourcePath: Shape
        type: GEOMETRY
        role: PRIMARY_GEOMETRY
        geometryType: MULTI_POLYGON

      # -----------------------------------------------------------------------
      # level_cm
      # Example numeric attribute.
      # This becomes filterable/queryable if enabled in the service config.
      # Example client filter:
      #   ?filter=level_cm IS NOT NULL AND level_cm > 100
      # -----------------------------------------------------------------------
      level_cm:
        sourcePath: level_cm
        type: INTEGER

      # -----------------------------------------------------------------------
      # Optional example of another nullable integer field.
      # If this source column contains NULL, current GeoJSON responses may omit
      # the property instead of writing it as JSON null.
      # -----------------------------------------------------------------------
      storeys_above_ground:
        sourcePath: storeys_above_ground
        type: INTEGER

      # -----------------------------------------------------------------------
      # Optional example of a string property.
      # Useful if you want a text field available for q-search or filtering.
      # -----------------------------------------------------------------------
      name:
        sourcePath: name
        type: STRING

      # -----------------------------------------------------------------------
      # Optional example of a date/time property.
      # Uncomment and adjust if your source contains a timestamp column.
      # role examples: PRIMARY_INSTANT, PRIMARY_INTERVAL_START, PRIMARY_INTERVAL_END
      # -----------------------------------------------------------------------
      # updated_at:
      #   sourcePath: updated_at
      #   type: DATETIME
      #   role: PRIMARY_INSTANT