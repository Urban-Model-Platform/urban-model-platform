[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
# same as isort, black
line-length = 88
# Assume Python 3.8
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.poetry]
name = "ump"
version = "3.0.0rc1"
description = "server federation api, OGC Api Processes-based to connect model servers and centralize access to them"
authors = [
    "Rico Herzog <rico.herzog@hcu-hamburg.de>",
    "Maja Richter <maja.richter@gv.hamburg.de>",
    "Stefan Schuhart <stefan.schuhart@gv.hamburg.de>"
]
readme = "README.md"
package-mode = true

[tool.poetry.urls]
Homepage = "https://citysciencelab.github.io/urban-model-platform"
Documentation = "https://github.com/citysciencelab/urban-model-platform"
Changelog = "https://github.com/citysciencelab/urban-model-platform/changelog.md"
Repository = "https://github.com/citysciencelab/urban-model-platform"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiohttp = "^3.9.5"
python-dotenv = "^1.0.1"
gunicorn = "^23.0.0"
pyyaml = "^6.0.2"
watchdog = "^5.0.3"
pydantic-settings = "^2.8.1"
pydantic = "^2.11.1"
uvicorn = "^0.37.0"
fastapi = "^0.118.1"
jinja2 = "^3.1.6"
tenacity = "^8.2.3"
sqlmodel = "^0.0.39"
alembic = "^1.14"
asyncpg = "^0.30"

[tool.poetry.group.dev.dependencies]
# formatting, quality, tests
autoflake = ">=1.4"
black = ">=23.7"
isort = ">=5.7.0"
mypy = ">=0.812"
pytest = ">=6.2.2"
pytest-cov = ">=2.11.1"
pytest-randomly = ">=3.5.0"
pytest-sugar = ">=0.9.4,<1"
pytest-xdist = ">=2.2.0,<3"
types-toml = ">=0.10.1,<1"
pre-commit = ">=3.4.0,<4"
debugpy = "^1.8.5"
flake8 = "^7.1.1"
pylint = "^3.3.1"
bump-my-version = "^1.2.0"
pytest-asyncio = "^1.2.0"
pytest-mock = "^3.15.1"
aioresponses = "^0.7.8"
requests = "^2.32.5"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
jupyter-book = "^1"
sphinx-autoapi = "^3"
sphinxcontrib-autoyaml = "^1.1"

[tool.black]
line-length = 88
exclude = "tests/fixtures"

[tool.isort]
profile = "black"
line_length = 88
not_skip = "__init__.py"
multi_line_output = 3
force_single_line = false
balanced_wrapping = true
default_section = "THIRDPARTY"
known_first_party = "ump"
include_trailing_comma = true
